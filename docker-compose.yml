services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdfv
      POSTGRES_PASSWORD: pdfv
      POSTGRES_DB: pdfv
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfv"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/pdf-validator"

  api: &backend
    build: ./backend
    environment: &env
      DATABASE_URL: postgresql+psycopg://pdfv:pdfv@db:5432/pdfv
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      S3_BUCKET: pdf-validator
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    ports: []

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
